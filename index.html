<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>CYBER FPS | 纯手写3D引擎</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            height: 100vh;
            background-color: #000;
            overflow: hidden;
            font-family: 'Courier New', Courier, monospace;
            cursor: none;
            touch-action: none; /* 禁止手机端默认滑动 */
        }
        canvas {
            display: block;
            width: 100vw;
            height: 100vh;
        }
        /* 开始界面 */
        #start-screen {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.9);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: #00f3ff;
            z-index: 100;
            backdrop-filter: blur(10px);
        }
        h1 {
            font-size: 2.5rem;
            letter-spacing: 5px;
            margin-bottom: 20px;
            text-shadow: 0 0 20px #00f3ff;
            animation: pulse 2s infinite alternate;
        }
        p {
            color: #888;
            margin-bottom: 40px;
            line-height: 1.8;
            text-align: center;
            letter-spacing: 1px;
            font-size: 0.9rem;
        }
        button {
            padding: 15px 50px;
            background: transparent;
            border: 2px solid #00f3ff;
            color: #00f3ff;
            font-size: 1.2rem;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s;
            box-shadow: 0 0 20px rgba(0, 243, 255, 0.2);
            border-radius: 5px;
        }
        button:hover { background: #00f3ff; color: #000; box-shadow: 0 0 40px #00f3ff; }
        @keyframes pulse { from { transform: scale(1); } to { transform: scale(1.05); } }
        
        /* 游戏内 UI */
        #ui {
            position: absolute;
            top: 20px; left: 20px; right: 20px;
            display: flex;
            justify-content: space-between;
            color: #00f3ff;
            font-size: 1.2rem;
            font-weight: bold;
            pointer-events: none;
            text-shadow: 0 0 10px #00f3ff;
            z-index: 10;
            display: none;
        }

        /* 手机端虚拟摇杆 */
        #joystick-zone {
            position: absolute;
            bottom: 30px;
            left: 30px;
            width: 120px;
            height: 120px;
            border-radius: 50%;
            background: rgba(0, 243, 255, 0.1);
            border: 2px solid rgba(0, 243, 255, 0.3);
            display: none;
            z-index: 20;
            touch-action: none;
        }
        #joystick-knob {
            position: absolute;
            top: 50%; left: 50%;
            width: 50px; height: 50px;
            border-radius: 50%;
            background: #00f3ff;
            transform: translate(-50%, -50%);
            box-shadow: 0 0 15px #00f3ff;
            touch-action: none;
        }
    </style>
</head>
<body>

    <div id="start-screen">
        <h1>CYBER FPS</h1>
        <p id="start-desc">
            电脑端: WASD移动 // 鼠标视角 // 左键开火<br>
            手机端: 左侧摇杆移动 // 右侧滑动视角 // 点击开火
        </p>
        <button id="startBtn">接入神经网络</button>
    </div>

    <div id="ui">
        <div>SCORE: <span id="score">0</span></div>
        <div style="color:#ff0055;">TARGETS: <span id="targets">0</span></div>
    </div>

    <!-- 手机端摇杆 -->
    <div id="joystick-zone">
        <div id="joystick-knob"></div>
    </div>

    <canvas id="gameCanvas"></canvas>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const startScreen = document.getElementById('start-screen');
        const startBtn = document.getElementById('startBtn');
        const scoreEl = document.getElementById('score');
        const targetsEl = document.getElementById('targets');
        const uiLayer = document.getElementById('ui');
        const joystickZone = document.getElementById('joystick-zone');
        const joystickKnob = document.getElementById('joystick-knob');

        let W, H;
        function resize() {
            W = canvas.width = window.innerWidth;
            H = canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resize);
        resize();

        // 设备检测
        const isMobile = /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent);

        // ==========================================
        // 1. 3D 引擎核心数学运算与变量
        // ==========================================
        let isPlaying = false;
        let score = 0;
        let targetsHit = 0;

        let camera = {
            x: 0, y: 1.6, z: 0,
            yaw: 0, pitch: 0
        };

        const keys = {};
        window.addEventListener('keydown', (e) => keys[e.key.toLowerCase()] = true);
        window.addEventListener('keyup', (e) => keys[e.key.toLowerCase()] = false);

        let recoil = 0;
        
        // --- 电脑端鼠标 ---
        document.addEventListener('mousemove', (e) => {
            if (document.pointerLockElement === canvas) {
                camera.yaw -= e.movementX * 0.002;
                camera.pitch -= e.movementY * 0.002;
                if (camera.pitch > Math.PI / 2) camera.pitch = Math.PI / 2;
                if (camera.pitch < -Math.PI / 2) camera.pitch = -Math.PI / 2;
            }
        });

        // --- 手机端触摸 ---
        let touchStartX = 0, touchStartY = 0;
        let isTouchingRight = false;
        
        // 摇杆变量
        let joyX = 0, joyY = 0;
        let isJoystickActive = false;

        if (isMobile) {
            document.getElementById('start-desc').innerText = "左侧摇杆移动\n右侧滑动视角\n点击屏幕射击";
            joystickZone.style.display = 'block';
        }

        // 摇杆控制
        joystickZone.addEventListener('touchstart', (e) => {
            e.preventDefault();
            isJoystickActive = true;
        });

        joystickZone.addEventListener('touchmove', (e) => {
            e.preventDefault();
            if (!isJoystickActive) return;
            let touch = e.touches[0];
            let rect = joystickZone.getBoundingClientRect();
            let centerX = rect.left + rect.width / 2;
            let centerY = rect.top + rect.height / 2;
            
            let dx = touch.clientX - centerX;
            let dy = touch.clientY - centerY;
            
            let distance = Math.hypot(dx, dy);
            let maxDist = 40;
            
            if (distance > maxDist) {
                dx = (dx / distance) * maxDist;
                dy = (dy / distance) * maxDist;
            }
            
            joystickKnob.style.transform = `translate(calc(-50% + ${dx}px), calc(-50% + ${dy}px))`;
            
            joyX = dx / maxDist;
            joyY = dy / maxDist;
        });

        joystickZone.addEventListener('touchend', (e) => {
            e.preventDefault();
            isJoystickActive = false;
            joystickKnob.style.transform = 'translate(-50%, -50%)';
            joyX = 0;
            joyY = 0;
        });

        // 屏幕右侧滑动视角 & 射击
        canvas.addEventListener('touchstart', (e) => {
            if (!isPlaying) return;
            // 判断点击区域是否在右侧
            let touch = e.touches[0];
            if (touch.clientX > W / 2) {
                isTouchingRight = true;
                touchStartX = touch.clientX;
                touchStartY = touch.clientY;
            } else {
                // 如果在左侧且没按在摇杆上，也算开火（方便操作）
                if (touch.clientX > 150) shoot();
            }
        }, {passive: false});

        canvas.addEventListener('touchmove', (e) => {
            if (!isPlaying || !isTouchingRight) return;
            e.preventDefault();
            let touch = e.touches[0];
            let dx = touch.clientX - touchStartX;
            let dy = touch.clientY - touchStartY;
            
            camera.yaw -= dx * 0.005;
            camera.pitch -= dy * 0.005;
            
            if (camera.pitch > Math.PI / 2) camera.pitch = Math.PI / 2;
            if (camera.pitch < -Math.PI / 2) camera.pitch = -Math.PI / 2;

            touchStartX = touch.clientX;
            touchStartY = touch.clientY;
        }, {passive: false});

        canvas.addEventListener('touchend', (e) => {
            if (!isPlaying) return;
            // 如果右侧滑动距离极短，视为点击射击
            let touch = e.changedTouches[0];
            if (isTouchingRight && Math.hypot(touch.clientX - touchStartX, touch.clientY - touchStartY) < 10) {
                shoot();
            }
            isTouchingRight = false;
        });

        // 电脑端射击
        canvas.addEventListener('mousedown', () => {
            if (isPlaying && document.pointerLockElement === canvas) shoot();
        });

        // ==========================================
        // 2. 3D 渲染管线
        // ==========================================
        function projectPoint(x, y, z) {
            let dx = x - camera.x;
            let dy = y - camera.y;
            let dz = z - camera.z;

            let cosYaw = Math.cos(-camera.yaw);
            let sinYaw = Math.sin(-camera.yaw);
            let rx = dx * cosYaw - dz * sinYaw;
            let rz = dx * sinYaw + dz * cosYaw;

            let cosPitch = Math.cos(-camera.pitch);
            let sinPitch = Math.sin(-camera.pitch);
            let ry = dy * cosPitch - rz * sinPitch;
            let finalZ = dy * sinPitch + rz * cosPitch;

            if (finalZ <= 0.1) return null;

            let focalLength = 800;
            let screenX = (rx / finalZ) * focalLength + W / 2;
            let screenY = -(ry / finalZ) * focalLength + H / 2;

            return { x: screenX, y: screenY, z: finalZ };
        }

        // ==========================================
        // 3. 游戏场景物体 (彻底分散)
        // ==========================================
        let targets = [];
        function spawnTarget() {
            targets.push({
                // 横向拉宽，深度拉远
                x: (Math.random() - 0.5) * 40, // 范围 -20 到 20
                y: Math.random() * 3 + 0.5,    // 高度 0.5 到 3.5
                z: Math.random() * 50 + 10,    // 深度 10 到 60
                radius: 1.5,
                color: '#ff0055',
                alive: true,
                hitTimer: 0
            });
        }
        for (let i = 0; i < 15; i++) spawnTarget();

        const gridSize = 2;
        const gridRange = 30; // 网格也扩大

        // ==========================================
        // 4. 渲染主循环
        // ==========================================
        function draw() {
            ctx.fillStyle = '#050505';
            ctx.fillRect(0, 0, W, H);

            // 星空
            ctx.fillStyle = '#ffffff';
            for (let i = 0; i < 100; i++) {
                let sx = (i * 137.5) % W;
                let sy = (i * 73.3) % H;
                ctx.globalAlpha = Math.random() * 0.5 + 0.1;
                ctx.fillRect(sx, sy, 1, 1);
            }
            ctx.globalAlpha = 1;

            // 地面网格
            ctx.strokeStyle = 'rgba(0, 243, 255, 0.15)';
            ctx.lineWidth = 1;
            for (let i = -gridRange; i <= gridRange; i += gridSize) {
                let p1 = projectPoint(i, 0, 0);
                let p2 = projectPoint(i, 0, 60);
                if (p1 && p2) {
                    ctx.beginPath(); ctx.moveTo(p1.x, p1.y); ctx.lineTo(p2.x, p2.y); ctx.stroke();
                }
            }
            for (let i = 0; i <= 60; i += gridSize) {
                let p1 = projectPoint(-gridRange, 0, i);
                let p2 = projectPoint(gridRange, 0, i);
                if (p1 && p2) {
                    ctx.beginPath(); ctx.moveTo(p1.x, p1.y); ctx.lineTo(p2.x, p2.y); ctx.stroke();
                }
            }

            // 渲染靶子
            targets.forEach(t => {
                if (!t.alive) {
                    if (t.hitTimer > 0) t.hitTimer--;
                    else {
                        t.x = (Math.random() - 0.5) * 40;
                        t.y = Math.random() * 3 + 0.5;
                        t.z = Math.random() * 50 + 10;
                        t.alive = true;
                    }
                }

                if (t.alive) {
                    let p = projectPoint(t.x, t.y, t.z);
                    if (p) {
                        let screenRadius = (t.radius / p.z) * 800;
                        
                        // 根据距离调整透明度，距离越远越暗
                        let alpha = Math.max(0.2, 1 - (p.z / 60));
                        
                        ctx.beginPath();
                        ctx.arc(p.x, p.y, screenRadius, 0, Math.PI * 2);
                        ctx.fillStyle = `rgba(255, 0, 85, ${alpha})`;
                        ctx.shadowBlur = 20 * alpha;
                        ctx.shadowColor = '#ff0055';
                        ctx.fill();
                        
                        ctx.beginPath();
                        ctx.arc(p.x, p.y, screenRadius * 0.4, 0, Math.PI * 2);
                        ctx.fillStyle = `rgba(255, 255, 255, ${alpha})`;
                        ctx.shadowBlur = 0;
                        ctx.fill();
                    }
                }
            });

            // 准星
            ctx.strokeStyle = '#00f3ff';
            ctx.lineWidth = 2;
            ctx.beginPath();
            let crossY = H / 2 - recoil * 20;
            ctx.moveTo(W/2 - 15, crossY); ctx.lineTo(W/2 - 5, crossY);
            ctx.moveTo(W/2 + 5, crossY); ctx.lineTo(W/2 + 15, crossY);
            ctx.moveTo(W/2, crossY - 15); ctx.lineTo(W/2, crossY - 5);
            ctx.moveTo(W/2, crossY + 5); ctx.lineTo(W/2, crossY + 15);
            ctx.stroke();

            ctx.fillStyle = '#00f3ff';
            ctx.beginPath(); ctx.arc(W/2, crossY, 2, 0, Math.PI * 2); ctx.fill();

            // 手机端开火提示线
            if (isMobile) {
                ctx.strokeStyle = 'rgba(0, 243, 255, 0.1)';
                ctx.beginPath();
                ctx.moveTo(W/2, 0); ctx.lineTo(W/2, H);
                ctx.stroke();
            }

            // 暗角
            let vignette = ctx.createRadialGradient(W/2, H/2, H*0.4, W/2, H/2, H*0.8);
            vignette.addColorStop(0, 'transparent');
            vignette.addColorStop(1, 'rgba(255, 0, 0, 0.15)');
            ctx.fillStyle = vignette;
            ctx.fillRect(0, 0, W, H);
        }

        // ==========================================
        // 5. 射击判定
        // ==========================================
        function shoot() {
            recoil += 1;
            let hitSomething = false;
            let closestTarget = null;
            let minDistance = Infinity;

            targets.forEach(t => {
                if (!t.alive) return;
                let p = projectPoint(t.x, t.y, t.z);
                if (p) {
                    let distToCenter = Math.hypot(p.x - W/2, p.y - (H/2 - recoil * 20));
                    let screenRadius = (t.radius / p.z) * 800;
                    
                    if (distToCenter < screenRadius + 10) {
                        if (p.z < minDistance) {
                            minDistance = p.z;
                            closestTarget = t;
                            hitSomething = true;
                        }
                    }
                }
            });

            if (hitSomething && closestTarget) {
                closestTarget.alive = false;
                closestTarget.hitTimer = 60;
                score += 100;
                targetsHit++;
                scoreEl.innerText = score;
                targetsEl.innerText = targetsHit;
                
                // 震动效果 (手机端调用震动API，电脑端用CSS)
                if (isMobile && navigator.vibrate) navigator.vibrate(50);
                document.body.style.transform = `translate(${Math.random()*4-2}px, ${Math.random()*4-2}px)`;
                setTimeout(() => document.body.style.transform = 'none', 50);
            }
        }

        // ==========================================
        // 6. 游戏主循环与移动逻辑
        // ==========================================
        function update() {
            if (!isPlaying) return;

            let moveSpeed = 0.15;
            let forwardX = Math.sin(camera.yaw);
            let forwardZ = Math.cos(camera.yaw);
            let rightX = Math.cos(camera.yaw);
            let rightZ = -Math.sin(camera.yaw);

            // 电脑端移动
            if (!isMobile) {
                if (keys['w']) { camera.x += forwardX * moveSpeed; camera.z += forwardZ * moveSpeed; }
                if (keys['s']) { camera.x -= forwardX * moveSpeed; camera.z -= forwardZ * moveSpeed; }
                if (keys['a']) { camera.x -= rightX * moveSpeed; camera.z -= rightZ * moveSpeed; }
                if (keys['d']) { camera.x += rightX * moveSpeed; camera.z += rightZ * moveSpeed; }
            } else {
                // 手机端摇杆移动 (joyY 向上是负数)
                if (isJoystickActive) {
                    camera.x += (forwardX * -joyY + rightX * joyX) * moveSpeed * 1.5;
                    camera.z += (forwardZ * -joyY + rightZ * joyX) * moveSpeed * 1.5;
                }
            }

            recoil *= 0.85;
            if (recoil < 0.01) recoil = 0;

            draw();
            requestAnimationFrame(update);
        }

        startBtn.addEventListener('click', () => {
            startScreen.style.display = 'none';
            uiLayer.style.display = 'flex';
            isPlaying = true;
            if (!isMobile) canvas.requestPointerLock();
            update();
        });

        document.addEventListener('pointerlockchange', () => {
            if (!isMobile && document.pointerLockElement !== canvas && isPlaying) {
                startScreen.style.display = 'flex';
                isPlaying = false;
            }
        });
    </script>
</body>
</html>
